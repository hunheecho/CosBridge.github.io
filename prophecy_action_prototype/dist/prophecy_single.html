<script>
// 공통 네임스페이스와 유틸. 브라우저와 Node(vm) 양쪽에서 로드된다.
var PA = (typeof PA !== 'undefined') ? PA : {};
if (typeof globalThis !== 'undefined') globalThis.PA = PA;

PA.VERSION = '0.4.0';

// mulberry32: 시드 기반 결정적 난수
PA.rng = {
  create(seed) {
    let a = (seed >>> 0) || 1;
    const next = () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      range(lo, hi) { return lo + (hi - lo) * next(); },
      int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
      pick(arr) { return arr[Math.floor(next() * arr.length)]; },
      shuffle(arr) { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; },
    };
  },
};

PA.m = {
  clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); },
  len(x, y) { return Math.hypot(x, y); },
  dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); },
  norm(x, y) { const l = Math.hypot(x, y); return l > 1e-9 ? { x: x / l, y: y / l } : { x: 0, y: 0 }; },
  lerp(a, b, t) { return a + (b - a) * t; },
  angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; },
  // 점 p가 원(c, r)과 각도 ang 중심, 반각 half 의 부채꼴 안에 있는가 (p는 반지름 pr의 원)
  inArc(c, r, ang, half, p, pr) {
    const d = Math.hypot(p.x - c.x, p.y - c.y);
    if (d > r + pr) return false;
    if (d <= pr) return true;
    const a = Math.atan2(p.y - c.y, p.x - c.x);
    const dd = Math.abs(PA.m.angDiff(ang, a));
    // 반지름 보정: 가까울수록 각도 허용 폭 넓어짐
    const extra = Math.asin(Math.min(1, pr / Math.max(d, 1e-6)));
    return dd <= half + extra;
  },
  // 원(p, pr)이 시작 s에서 각도 ang 방향 길이 L, 폭 W인 직사각형과 겹치는가
  inBeam(s, ang, L, W, p, pr) {
    const dx = p.x - s.x, dy = p.y - s.y;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const along = dx * ca + dy * sa;
    const side = -dx * sa + dy * ca;
    return along >= -pr && along <= L + pr && Math.abs(side) <= W / 2 + pr;
  },
  circleHit(a, b) { const d = Math.hypot(a.x - b.x, a.y - b.y); return d <= a.r + b.r; },
  // 선분 (x0,y0)->(x1,y1)이 원(c, r)에 처음 닿는 매개변수 t(0..1). 시작점이 이미 안이면 0. 안 닿으면 null
  segCircleT(x0, y0, x1, y1, c, r) {
    const fx = x0 - c.x, fy = y0 - c.y;
    if (fx * fx + fy * fy <= r * r) return 0;
    const dx = x1 - x0, dy = y1 - y0;
    const a = dx * dx + dy * dy; if (a < 1e-12) return null;
    const b = 2 * (fx * dx + fy * dy), cc = fx * fx + fy * fy - r * r;
    const disc = b * b - 4 * a * cc; if (disc < 0) return null;
    const t = (-b - Math.sqrt(disc)) / (2 * a);
    return (t >= 0 && t <= 1) ? t : null;
  },
  // 반지름 r인 원이 (x0,y0)->(x1,y1)로 쓸고 갈 때 장애물 원 목록과 처음 닿는 t와 장애물
  sweepCircle(x0, y0, x1, y1, r, circles) {
    let best = null;
    for (const ob of circles) { const t = PA.m.segCircleT(x0, y0, x1, y1, ob, ob.r + r); if (t != null && (best == null || t < best.t)) best = { t, ob }; }
    return best;
  },
  // 선분 (x0,y0)-(x1,y1) 과 원 (c, r) 교차 (스윕 충돌용)
  segCircle(x0, y0, x1, y1, c, r) {
    const dx = x1 - x0, dy = y1 - y0;
    const l2 = dx * dx + dy * dy;
    let t = 0;
    if (l2 > 1e-9) t = PA.m.clamp(((c.x - x0) * dx + (c.y - y0) * dy) / l2, 0, 1);
    const px = x0 + dx * t, py = y0 + dy * t;
    return Math.hypot(c.x - px, c.y - py) <= r;
  },
};

PA.fmt = {
  pct(mult) { const p = Math.round((mult - 1) * 100); return (p >= 0 ? '+' : '') + p + '%'; },
  num(n) { return Math.round(n * 10) / 10; },
};

</script>
<script>
// 전투 입력 큐. 눌림 상태(keys)와 단발 입력(pressed)을 관리하고, 정지 중에는 전투 입력을 받지 않는다.
var PA = (typeof PA !== 'undefined') ? PA : {};

PA.Input = (function () {
  const MOVE = { KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0], KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1] };
  const ONESHOT = { Space: 'dodge', KeyQ: 'special' };
  function create() { return { keys: new Set(), pressed: new Set(), blocked: false }; }
  // 정지(blocked=true)·재개(blocked=false) 양쪽에서 남은 눌림/단발 입력을 모두 비운다
  function setBlocked(inp, blocked) { inp.blocked = !!blocked; inp.keys.clear(); inp.pressed.clear(); }
  function keyDown(inp, code) {
    if (inp.blocked) return false;            // 정지 중에는 누적하지 않는다
    inp.keys.add(code);
    if (ONESHOT[code]) inp.pressed.add(code);
    return true;
  }
  function keyUp(inp, code) { inp.keys.delete(code); }
  function clearAll(inp) { inp.keys.clear(); inp.pressed.clear(); }
  function state(inp) {
    let mx = 0, my = 0;
    for (const code of inp.keys) { const m = MOVE[code]; if (m) { mx += m[0]; my += m[1]; } }
    return { mx: Math.max(-1, Math.min(1, mx)), my: Math.max(-1, Math.min(1, my)), dodge: inp.pressed.has('Space'), special: inp.pressed.has('KeyQ') };
  }
  function consumePressed(inp) { inp.pressed.clear(); }
  return { create, setBlocked, keyDown, keyUp, clearAll, state, consumePressed, MOVE, ONESHOT };
})();

</script>

<script>
// 회차 상태(장비·증강) → 전투에서 쓰는 실제 수치. 중복 적용을 막기 위해 항상 여기서만 계산한다.
var PA = (typeof PA !== 'undefined') ? PA : {};

PA.Build = {
  emptyGear() { return { weapon: 'sword', armor: null, acc: null, upgrade: 0 }; },

  derive(run) {
    const C = PA.CONFIG;
    const gear = run.gear || PA.Build.emptyGear();
    const aug = run.augments || {};
    const level = (id) => aug[id] || 0;
    const has = (id) => level(id) > 0;
    const weaponId = gear.weapon || 'sword';
    const weapon = Object.assign({}, PA.CONFIG.WEAPONS[weaponId]);

    let damageMult = 1, rangeMult = 1, intervalMult = 1;
    damageMult *= 1 + 0.25 * level('sharp');
    rangeMult *= 1 + 0.25 * level('wide');
    intervalMult *= Math.pow(0.85, level('quick'));
    damageMult *= 1 + 0.15 * (gear.upgrade || 0);

    let hpMax = C.PLAYER.hp;
    if (gear.armor === 'leather_armor') hpMax += 30;

    let dodgeCdMult = 1, specialCd = C.PLAYER.special.cooldown, exposedMult = C.PLAYER.exposedMult;
    if (gear.acc === 'time_charm') { dodgeCdMult = 0.7; specialCd -= 3; }
    if (gear.acc === 'fang_necklace') exposedMult = 2.0;

    return {
      weaponId, weapon, damageMult, rangeMult, intervalMult, hpMax, dodgeCdMult, specialCd, exposedMult,
      damage: weapon.damage * damageMult,
      interval: weapon.interval * intervalMult,
      range: weapon.range * rangeMult,
      aug: Object.assign({}, aug), has, level,
      shield: has('barrier') ? C.BARRIER.shield : 0,
    };
  },

  // 미리보기용: 장비/증강 후보를 적용했을 때의 파생 수치
  preview(run, patch) {
    const r = { gear: Object.assign({}, run.gear), augments: Object.assign({}, run.augments) };
    if (patch.gear) Object.assign(r.gear, patch.gear);
    if (patch.augment) r.augments[patch.augment] = (r.augments[patch.augment] || 0) + 1;
    return PA.Build.derive(r);
  },

  // 실제 계산에 근거한 "늑대 처치 필요 타격 수"
  hitsToKill(build, enemyType) {
    const hp = PA.ENEMIES[enemyType].hp;
    return Math.ceil(hp / build.damage);
  },

  // 증강 제시 가능 여부
  augmentEligible(run, def) {
    const lv = (run.augments || {})[def.id] || 0;
    if (lv >= def.max) return false;
    if (def.requires && def.requires.some(r => !((run.augments || {})[r] > 0))) return false;
    return true;
  },

  // 증강이 현재 빌드에서 갖는 연결 설명 (선택 화면용). 모든 수치는 실제 파생 계산(preview)에서 온다.
  connectionText(run, def) {
    const b = PA.Build.derive(run), nb = PA.Build.preview(run, { augment: def.id });
    const lv = (run.augments || {})[def.id] || 0, has = (id) => b.has(id), pierce = b.weaponId === 'pierce';
    const parts = [];
    const wname = pierce ? '관통검' : '기본검';
    switch (def.id) {
      case 'wide': parts.push(pierce ? `현재 관통검의 길이 ${Math.round(b.range)} → ${Math.round(nb.range)}` : `현재 검격 반지름 ${Math.round(b.range)} → ${Math.round(nb.range)}`); if (has('spin')) parts.push(`회전 검격 반지름 ${Math.round(PA.CONFIG.SPIN.radius * b.rangeMult)} → ${Math.round(PA.CONFIG.SPIN.radius * nb.rangeMult)}`); break;
      case 'sharp': parts.push(`피해 ${PA.fmt.num(b.damage)} → ${PA.fmt.num(nb.damage)} · 늑대 ${PA.Build.hitsToKill(b, 'wolf')}타 → ${PA.Build.hitsToKill(nb, 'wolf')}타`); break;
      case 'quick': parts.push(`공격 주기 ${PA.fmt.num(b.interval)}초 → ${PA.fmt.num(nb.interval)}초`); if (has('spin')) parts.push('회전 검격도 더 자주'); break;
      case 'spin': parts.push(`${wname}의 3번째 공격이 반지름 ${Math.round(PA.CONFIG.SPIN.radius * b.rangeMult)} 회전 검격이 됩니다`); parts.push('감속장(Q) 안에 모인 적을 한 번에 쓸어내는 조합'); if (has('frost')) parts.push('회전으로 여러 적에게 냉기'); if (has('stasis')) parts.push('회전 검격도 흔적을 쌓습니다'); break;
      case 'ember': parts.push('회피(Space)할 때마다 경로에 불길 3개 (판정 성공과 무관)'); parts.push(has('flare') ? '불꽃 파열이 연결됩니다' : '이후 "불꽃 파열"이 제시됩니다'); break;
      case 'frost': parts.push(pierce ? '관통검: 한 줄의 적 모두에게 냉기' : '검격 적중마다 냉기 (관통검을 만들면 한 줄 전체)'); if (has('spin')) parts.push('회전 검격으로 주변 전체 냉기'); parts.push('냉기 상태 처치 시 파편 6개가 다른 적을 때려 연쇄'); break;
      case 'mark': parts.push('자동 공격 우선순위: 정예 > 궁수 > 포자 > 늑대. 표식 대상 피해 +30%'); break;
      case 'echo': parts.push(pierce ? '4번째 관통 검격이 0.2초 뒤 반복' : '4번째 검격이 0.2초 뒤 반복'); if (has('spin')) parts.push('회전 검격이 4번째라면 회전이 반복'); break;
      case 'barrier': parts.push('조우 시작 보호막 30 (체력과 별도). 파괴 시 돌진 중인 늑대도 밀쳐냅니다'); break;
      case 'stasis': parts.push(`감속장(Q) 안에서 ${wname}${has('spin') ? '·회전' : ''} 적중마다 흔적 (최대 5). 종료 시 흔적×${Math.round(PA.CONFIG.STASIS.damagePerStack * b.damageMult)} 피해`); break;
      case 'flare': parts.push(has('ember') ? '잔불 걸음의 불길 위에서 처치하면 반지름 80 폭발 ' + Math.round(PA.CONFIG.FLARE.damage * b.damageMult) + ' 피해' : '잔불 걸음이 필요합니다'); break;
      case 'saving': parts.push(`감속장(Q) 재사용 ${PA.fmt.num(b.specialCd)}초. 감속장 안 처치 1마리당 -${PA.CONFIG.SAVING.cdPerKill}초`); if (has('spin')) parts.push('회전 검격으로 감속장 안 다수 처치 시 크게 단축'); break;
    }
    if (lv > 0) parts.unshift(`현재 ${lv}단계 → ${lv + 1}단계`);
    return parts.join(' · ');
  },
};

<script>
// 실시간 전투 시뮬레이션. 렌더링·입력 장치와 무관하게 dt만 받아 진행한다.
var PA = (typeof PA !== 'undefined') ? PA : {};

PA.Combat = (function () {
  const C = () => PA.CONFIG;
  const m = () => PA.m;
  let nextId = 1;

  function create(opts) {
    const cfg = C();
    const build = opts.build;
    const rng = PA.rng.create(opts.seed || 1);
    const arenaDef = PA.ARENAS[opts.arena || 'forest'] || PA.ARENAS.forest;
    const st = {
      t: 0, seed: opts.seed || 1, rng, arena: Object.assign({}, cfg.ARENA), arenaId: opts.arena || 'forest',
      obstacles: (opts.obstacles || arenaDef.obstacles || []).map(o => Object.assign({}, o)),
      build,
      objective: opts.objective || 'clear',
      waves: opts.waves || [[{ type: 'wolf', n: 2 }]],
      waveIndex: -1, waveTimer: 0.4, pending: [], // pending spawns {type,x,y,t}
      player: {
        x: (arenaDef.playerStart || { x: cfg.ARENA.w / 2 }).x, y: (arenaDef.playerStart || { y: cfg.ARENA.h / 2 }).y, r: cfg.PLAYER.r,
        hp: opts.hp != null ? Math.min(opts.hp, build.hpMax) : build.hpMax, hpMax: build.hpMax,
        shield: build.shield, shieldMax: build.shield,
        face: 0, moving: false, animT: 0,
        dodge: { active: false, t: 0, dx: 0, dy: 0, cd: 0 },
        hitProt: 0, zoneTick: 0,
        attackTimer: 0.2, attackCount: 0, echo: null,
        swingT: 9, swingForm: 'arc', swingAngle: 0, walkT: 0, hurtT: 9,
        special: { cd: 0 },
        dead: false, flash: 0,
      },
      field: null,          // 감속장 {x,y,r,ttl}
      enemies: [], projectiles: [], zones: [], effects: [], events: [],
      chest: null, chestSpawned: false,
      markTarget: null,
      status: 'running',    // running | won | lost
      stats: { kills: 0, damageTaken: 0, perfectDodges: 0, chestGold: 0, elapsed: 0, attacks: 0, bossDamage: 0, specialUses: 0 },
      spawnedAll: false,
      mode: opts.boss ? 'boss' : 'normal', intro: 0, boss: null, pickups: [], orbsSpawned: {}, phaseEvents: [], pendingLoss: false, bossDownT: 0,
    };
    if (opts.boss) {
      st.objective = 'boss'; st.waveIndex = 99; st.spawnedAll = true;
      const bs = arenaDef.bossStart || { x: cfg.ARENA.w / 2, y: 120 };
      PA.Boss.spawn(st, bs.x, bs.y);
      st.intro = PA.BOSS.intro; // 입장 연출: 아무도 행동하지 않고 피해도 없다
    }
    return st;
  }

  // ---------- 이벤트/이펙트 ----------
  function ev(st, name, data) { st.events.push(Object.assign({ name }, data || {})); }
  function fx(st, e) { st.effects.push(e); }
  function text(st, x, y, txt, color) { fx(st, { kind: 'text', x, y, text: txt, color: color || '#fff', ttl: 0.8, t: 0 }); }

  // ---------- 지형 ----------
  // 원형 개체를 장애물·벽 밖으로 밀어낸다(표면을 따라 미끄러짐). 반환: 밀려났는지
  function pushOut(st, o) {
    let moved = false;
    for (const ob of st.obstacles) {
      const dx = o.x - ob.x, dy = o.y - ob.y, d = Math.hypot(dx, dy), min = ob.r + o.r;
      if (d < min) { const n = d > 1e-6 ? { x: dx / d, y: dy / d } : { x: 1, y: 0 }; o.x = ob.x + n.x * min; o.y = ob.y + n.y * min; moved = true; }
    }
    const a = st.arena;
    const cx = m().clamp(o.x, o.r, a.w - o.r), cy = m().clamp(o.y, o.r, a.h - o.r);
    if (cx !== o.x || cy !== o.y) { o.x = cx; o.y = cy; moved = true; }

    if (d >= cfg.dash.minDist && d <= cfg.dash.maxDist && los) cands.push(['dash', cfg.weights.dash]);
    if (e.phase >= 2 && d >= cfg.pounce.minDist) cands.push(['pounce', cfg.weights.pounce]);
    if (canHowl(st, e)) cands.push(['howl', cfg.weights.howl]);
    // 같은 행동을 세 번 연속 반복하지 않는다
    const h = e.history, last2 = h.length >= 2 && h[h.length - 1] === h[h.length - 2] ? h[h.length - 1] : null;
    const pool = cands.filter(c => c[0] !== last2);
    const use = pool.length ? pool : cands;
    if (!use.length) return null;
    let sum = 0; for (const c of use) sum += c[1];
    let r = st.rng.next() * sum;
    for (const c of use) { r -= c[1]; if (r <= 0) return c[0]; }
    return use[use.length - 1][0];
  }
  function canHowl(st, e) { return (st.t - e.lastHowl) >= B().howl.interval && summonedAlive(st) < B().howl.maxWolves; }

  function begin(st, e, pattern) {
    e.actions++; e.history.push(pattern); if (e.history.length > 6) e.history.shift();
    e.stateT = 0; e.hitDone = false; e.waitT = 0;
    if (pattern === 'sweep') e.state = 'sweep_aim';
    else if (pattern === 'dash') { e.state = 'dash_aim'; e.dashSeq = 1; e.dashTotal = e.phase >= 3 ? 2 : 1; }
    else if (pattern === 'pounce') e.state = 'pounce_aim';
    else if (pattern === 'howl') { e.state = 'howl'; e.lastHowl = st.t; K().ev(st, 'boss_howl'); }
  }
  function toRecover(st, e, dur) { e.state = 'recover'; e.stateT = 0; e.recoverDur = dur; K().text(st, e.x, e.y - e.r - 30, '빈틈!', '#ffd166'); }
  function toApproach(st, e) { e.state = 'approach'; e.stateT = 0; e.approachT = 0; }

  // ---------- 단계 ----------
  function checkPhase(st, e) {
    // 체력선을 처음 통과할 때 회복 구슬 생성. 단계 적용은 현재 행동이 끝난 뒤(phasePending).
    const ratio = e.hp / e.hpMax;
    const ph = B().phases;
    for (let i = 0; i < ph.length; i++) {
      const want = i + 2;
      if (ratio <= ph[i] && !st.orbsSpawned[want]) { st.orbsSpawned[want] = true; spawnOrb(st, e); if (e.phasePending < want && e.phase < want) e.phasePending = want; }
    }
  }
  function spawnOrb(st, e) {
    const cfg = B().orb, p = st.player;
    let best = null, bd = Infinity;
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2, x = e.x + Math.cos(a) * cfg.ring, y = e.y + Math.sin(a) * cfg.ring;
      if (!K().validPos(st, x, y, cfg.r)) continue;
      if (m().dist({ x, y }, e) < e.r + cfg.r + 30) continue;
      if (inDanger(st, e, { x, y })) continue;
      const d = m().dist({ x, y }, p);
      if (d < bd) { bd = d; best = { x, y }; }
    }
    if (!best) best = K().nearestValidPos(st, p.x + 80, p.y, cfg.r, 300) || { x: p.x, y: p.y };
    st.pickups.push({ kind: 'heal', x: best.x, y: best.y, r: cfg.r, amount: Math.floor(st.player.hpMax * cfg.healRatio), t: 0 });
    K().text(st, best.x, best.y - 24, '회복 구슬', '#9cffb0');
  }
  // 현재 위험 예고 한가운데인가(돌진 통로·휩쓸기 부채꼴·착지 원)
  function inDanger(st, e, pt) {
    const cfg = B();
    if ((e.state === 'dash_lock' || e.state === 'dash') && e.dashEnd) return m().inBeam(e, e.dir, e.dashLen, (e.r + 14) * 2, pt, 14);
    if (e.state === 'sweep_aim' || e.state === 'sweep_lock') return m().inArc(e, cfg.sweep.radius, e.state === 'sweep_aim' ? e.aimAngle : e.dir, cfg.sweep.arcDeg * Math.PI / 360, pt, 14);

        e.stateT += dt;
        if (e.stateT >= cfg.intro) toApproach(st, e);
        break;
      case 'approach': {

        if (!pat) break;

          if (m().inArc(e, cfg.sweep.radius, e.dir, cfg.sweep.arcDeg * Math.PI / 360, p, p.r) && !K().losBlocked(st, e, p)) K().damagePlayer(st, cfg.sweep.damage, 'boss_sweep');
          K().fx(st, { kind: 'bosssweep', x: e.x, y: e.y, angle: e.dir, r: cfg.sweep.radius, half: cfg.sweep.arcDeg * Math.PI / 360, ttl: 0.3, t: 0 });
          K().ev(st, 'boss_sweep');
          toRecover(st, e, cfg.sweep.recover);
        }
        break;
      case 'dash_aim': {
        e.aimAngle = Math.atan2(p.y - e.y, p.x - e.x);
        e.stateT += adv;
        const aimT = e.dashSeq === 2 ? cfg.dash.second.aim : cfg.dash.aim;
        if (e.stateT >= aimT) { e.state = 'dash_lock'; e.stateT = 0; e.dir = e.aimAngle; const path = dashPath(st, e, e.dir, cfg.dash.dist); e.dashLen = path.len; e.dashEnd = path.end; e.dashDist = 0; e.hitDone = false; K().ev(st, 'boss_lock'); }
        break;
      }
      case 'dash_lock': {
        e.stateT += adv;
        const lockT = e.dashSeq === 2 ? cfg.dash.second.lock : cfg.dash.lock;
        if (e.stateT >= lockT) { e.state = 'dash'; e.stateT = 0; }

      }

        const step = Math.min(cfg.dash.speed * tf * dt, remain);
        const x0 = e.x, y0 = e.y;

        e.dashDist += Math.hypot(e.x - x0, e.y - y0);
        if (!e.hitDone && m().segCircle(x0, y0, e.x, e.y, p, p.r + e.r)) { e.hitDone = true; e.biteT = 0; K().ev(st, 'bite'); K().damagePlayer(st, cfg.dash.damage, 'boss_dash'); }
        if (e.dashDist >= e.dashLen - 1e-6 || mv.hit || step <= 1e-9) {
          if (e.dashSeq < e.dashTotal) { e.dashSeq++; e.state = 'dash_aim'; e.stateT = 0; K().text(st, e.x, e.y - e.r - 30, '연속 돌진 2/2', '#ff9f43'); }
          else toRecover(st, e, e.dashTotal > 1 ? cfg.dash.doubleRecover : cfg.dash.recover);

      }

        e.stateT += adv;
        if (e.stateT >= cfg.howl.duration) { summon(st, e); toApproach(st, e); e.approachT = 0; }
        break;
      case 'pounce_aim':

        e.stateT += adv;

      case 'pounce_lock':
        e.stateT += adv;

      case 'leap': {
        e.leapK = Math.min(1, e.leapK + adv / cfg.pounce.leap);

      }
      case 'recover':
        e.stateT += adv;
        if (e.stateT >= e.recoverDur) toApproach(st, e);
        break;
      case 'stagger':
        e.stateT += adv;
        if (e.stateT >= cfg.stagger) toApproach(st, e);
        break;

<script>
// 회차 상태: 날짜·시간·금화·재료·장비·증강·체력. 저장/불러오기. 전투 밖의 모든 규칙.
var PA = (typeof PA !== 'undefined') ? PA : {};

  function newRun(seed) {

  }

  // ---------- 지역/출격 ----------

  // ---------- 보스: 가시갈기 ----------
  function drawBoss(ctx, st, e) {
    const cfg = PA.BOSS, p = st.player, s = e.r / 14 * 0.95;
    const facingAng = (e.state === 'sweep_aim' || e.state === 'pounce_aim' || e.state === 'dash_aim') ? e.aimAngle : (e.state === 'sweep_lock' || e.state === 'dash_lock' || e.state === 'dash') ? e.dir : (e.state === 'leap' && e.land ? Math.atan2(e.land.y - e.leapFrom.y, e.land.x - e.leapFrom.x) : Math.atan2(p.y - e.y, p.x - e.x));

    const gait = Math.sin(e.moveT * TAU * 0.6);
    switch (e.state) {
      case 'intro': maneUp = 1; headTilt = -0.9; tailUp = 1; jaw = 0.6; break;
      case 'sweep_aim': headTilt = -0.55 * Math.min(1, e.stateT / 0.3); tilt = -0.06; jaw = 0.3; break;
      case 'sweep_lock': headTilt = -0.75; tilt = -0.1; jaw = 0.6; break;
      case 'dash_aim': bodyY = 4; ry = 7.5; headY = -3; tailUp = -0.5; legFold = 1; tilt = -0.12; jaw = 0.25; break;
      case 'dash_lock': bodyY = 5; ry = 7.5; headY = -2; tailUp = -0.7; legFold = 1; tilt = -0.2; jaw = 0.6; break;
      case 'dash': bodyY = 1; ry = 7.5; headY = -4; stretch = 1.35; legSpread = 1; jaw = e.biteT < 0.2 ? 0.05 : 0.7; break;
      case 'howl': maneUp = 1; headTilt = -1.1; tailUp = 1; jaw = 0.7; break;

      case 'leap': bodyY = 0; stretch = 1.2; legSpread = 1; headY = -6; jaw = 0.6; tailUp = 0.3; break;
      case 'recover': bodyY = 3; headY = 2; headTilt = 0.35; tailUp = -0.4; breathe = 1; jaw = 0.4; break;

    for (let i = 0; i < 4; i++) {
      const [hx, ph] = legs[i]; const hipY = bodyY + 5;
      let fx, fy;
      if (legSpread) { fx = hx + (hx > 0 ? 11 : -11); fy = hipY + 8; }
      else if (legFold) { fx = hx + (hx > 0 ? 3 : -3); fy = hipY + 7; }
      else if (dying) { fx = hx + 3; fy = hipY + 7; }
      else if (e.state === 'recover') { fx = hx + (hx > 0 ? 6 : -2); fy = hipY + 10; }

      ctx.fillStyle = '#26221e'; ctx.beginPath(); ctx.ellipse(fx + 1, fy, 3.2, 2, 0, 0, TAU); ctx.fill();
    }
    // 몸통 + 큰 어깨

    ctx.beginPath(); ctx.ellipse(L * 0.45, bodyY - 3, L * 0.5, ry * 0.95, 0, 0, TAU); ctx.fill(); // 어깨
    ctx.fillStyle = e.flash > 0 ? '#fff' : belly; ctx.beginPath(); ctx.ellipse(0, bodyY + 3.5, L * 0.7, ry * 0.45, 0, 0, TAU); ctx.fill();
    // 오래된 상처
    ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-6, bodyY - 5); ctx.lineTo(-1, bodyY + 1); ctx.moveTo(-3, bodyY - 6); ctx.lineTo(2, bodyY); ctx.stroke();
    // 가시갈기(목·등의 검은 가시). 세우면 길어진다
    ctx.fillStyle = thorn;
    for (let i = 0; i < 7; i++) { const bx = L * 0.75 - i * 4.2, by = bodyY - ry * 0.85 + (i > 3 ? 1 : 0); const h = (6 + (i < 4 ? 4 : 1)) * (1 + 0.6 * maneUp); ctx.beginPath(); ctx.moveTo(bx - 1.6, by + 1); ctx.lineTo(bx - 3 + (i % 2), by - h); ctx.lineTo(bx + 1.6, by + 1); ctx.closePath(); ctx.fill(); }

    ctx.beginPath(); ctx.moveTo(6, 3.5); ctx.lineTo(6.8, 5.5); ctx.lineTo(8, 3.5); ctx.fill(); // 부러진 송곳니(짧음)
    // 아래턱
    ctx.save(); ctx.translate(4, 3); ctx.rotate(jaw);
    ctx.fillStyle = e.flash > 0 ? '#fff' : fur2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, 0); ctx.lineTo(1, 4.5); ctx.closePath(); ctx.fill();

    const earBack = (e.state === 'dash_aim' || e.state === 'dash_lock' || e.state === 'dash') ? -4 : (maneUp ? 2 : 0);

    ctx.restore();
    // 상태 아이콘·흔적은 drawEnemy 공통 처리
  }

  // ---------- 궁수·포자(간이 표현, 후속 작업) ----------
  function drawArcher(ctx, st, e) {
    const d = e.def, toP = Math.atan2(st.player.y - e.y, st.player.x - e.x);

    ctx.save(); ctx.translate(e.x, e.y); if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.deathT / 0.5);

    ctx.strokeStyle = '#3d4a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-3, 4); ctx.lineTo(-3 + walk, 14); ctx.moveTo(3, 4); ctx.lineTo(3 - walk, 14); ctx.stroke();
    ctx.fillStyle = e.flash > 0 ? '#fff' : (e.chill > 0 ? '#b9e8d0' : d.color); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-6, -8, 12, 14, 3) : ctx.rect(-6, -8, 12, 14); ctx.fill();

    ctx.fillStyle = '#2e5a2c'; ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(0, -21); ctx.lineTo(7, -14); ctx.fill();

  function drawSpore(ctx, st, e) {

    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();

  }

  function drawEnemy(ctx, st, e) {
    if (e.boss) drawBoss(ctx, st, e);
    else if (e.type === 'wolf' || e.type === 'wolf_alpha') drawWolf(ctx, st, e);
    else if (e.type === 'archer') drawArcher(ctx, st, e);

  }

  // ---------- 마검사 (측면, 좌우 반전) ----------
  function drawSwordsman(ctx, st) {
    const p = st.player, b = st.build;
    const faceLeft = Math.cos(p.face) < 0;
    const la = faceLeft ? Math.PI - p.face : p.face; // 반전 좌표계에서의 바라보는 각도
    ctx.save(); ctx.translate(p.x, p.y);
    shadow(ctx, 0, 17 * VS, 13 * VS, 4.5 * VS);

    if (p.hitProt > 0 && Math.floor(st.t * 20) % 2 === 0) ctx.globalAlpha = 0.5;
    if (p.hurtT < 0.2) ctx.translate(Math.sin(st.t * 90) * 2.5, 0); // 피격 흔들림
    ctx.scale(faceLeft ? -VS : VS, VS);
    if (p.dodge.active) { const k = p.dodge.t / PA.CONFIG.PLAYER.dodge.duration; ctx.rotate(k * TAU * ((faceLeft ? -p.dodge.dx : p.dodge.dx) >= 0 ? 1 : -1)); ctx.scale(1, 0.85); }
    const walk = p.moving && !p.dodge.active ? Math.sin(p.walkT * 13) : 0;
    const bob = p.moving && !p.dodge.active ? Math.abs(Math.cos(p.walkT * 13)) * -1.5 : Math.sin(p.animT * 2) * 0.6;
    const hurt = p.flash > 0;
    // 망토
    ctx.fillStyle = hurt ? '#a04050' : '#25335c'; ctx.beginPath(); ctx.moveTo(-3, -8 + bob); ctx.lineTo(-9 - Math.abs(walk) * 4 - (p.moving ? 3 : 0), 6 + bob + Math.sin(p.animT * 6) * 1.5); ctx.lineTo(-2, 9 + bob); ctx.lineTo(4, -6 + bob); ctx.closePath(); ctx.fill();
    // 다리·장화
    ctx.strokeStyle = hurt ? '#c07080' : '#3a3f55'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, 6 + bob); ctx.lineTo(-3 + walk * 5, 16); ctx.moveTo(3, 6 + bob); ctx.lineTo(3 - walk * 5, 16); ctx.stroke();
    ctx.fillStyle = '#26221e'; ctx.beginPath(); ctx.ellipse(-3 + walk * 5 + 1, 17, 4, 2, 0, 0, TAU); ctx.ellipse(3 - walk * 5 + 1, 17, 4, 2, 0, 0, TAU); ctx.fill();
    // 몸통(갑옷)
    ctx.fillStyle = hurt ? '#ff9a9a' : '#4d7fd0'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-6.5, -9 + bob, 13, 17, 3) : ctx.rect(-6.5, -9 + bob, 13, 17); ctx.fill();
    ctx.fillStyle = hurt ? '#ffc0c0' : '#8fb6ee'; ctx.fillRect(-2, -7 + bob, 5, 12);
    ctx.fillStyle = '#2b2620'; ctx.fillRect(-6.5, 3 + bob, 13, 2.5);
    // 뒷팔
    ctx.strokeStyle = hurt ? '#ffb0b0' : '#e9c8a6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-5, -5 + bob); ctx.lineTo(-8, 3 + bob); ctx.stroke();
    // 머리
    ctx.fillStyle = hurt ? '#ffd0c0' : '#f1c9a5'; ctx.beginPath(); ctx.arc(0, -16 + bob, 6.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.arc(0, -17.5 + bob, 6.8, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(6.5, -15 + bob); ctx.lineTo(-6.8, -14 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1e1a18'; ctx.beginPath(); ctx.arc(3, -15.5 + bob, 1.3, 0, TAU); ctx.fill();
    // 앞팔 + 검
    const sw = p.swingT, swinging = sw < 0.18, form = p.swingForm;
    const swordColor = b.weaponId === 'pierce' ? '#bfefff' : '#e8ecf2';
    let sa, reach = 7;

    else if (swinging && form === 'beam') { sa = la; reach = 7 + 9 * (1 - sw / 0.18); }
    else if (swinging) sa = la - 1.4 + 2.8 * Math.min(1, sw / 0.16);
    else sa = la + 0.95; // 대기: 앞쪽 아래로 든 자세

    ctx.strokeStyle = hurt ? '#ffb0b0' : '#e9c8a6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(hx, hy); ctx.stroke();

    ctx.fillStyle = '#5a4630'; ctx.fillRect(-6, -1.5, 6, 3); // 손잡이
    ctx.fillStyle = '#c9a44a'; ctx.fillRect(-1, -4.5, 3, 9); // 날밑
    ctx.fillStyle = swordColor; ctx.beginPath(); ctx.moveTo(2, -2.2); ctx.lineTo(bl - 5, -2.2); ctx.lineTo(bl, 0); ctx.lineTo(bl - 5, 2.2); ctx.lineTo(2, 2.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(3, -0.6, bl - 8, 1.2);
    if (swinging) { ctx.strokeStyle = `rgba(200,235,255,${0.9 * (1 - sw / 0.18)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(bl + 6, 0); ctx.stroke(); }
    ctx.restore();
    ctx.restore();
    if (p.shield > 0) { ctx.strokeStyle = 'rgba(126,242,255,0.85)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y - 2, p.r + 10, 0, TAU); ctx.stroke(); ctx.fillStyle = 'rgba(126,242,255,0.08)'; ctx.fill(); }
  }
  function drawRange(ctx, st) {
    const p = st.player, b = st.build;
    ctx.strokeStyle = 'rgba(150,210,255,0.16)'; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);

    else { ctx.beginPath(); ctx.arc(p.x, p.y, b.range, 0, TAU); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  function drawTelegraphs(ctx, st) {
    const a = st.arena;
    for (const e of st.enemies) {
      if (e.dead) continue;
      const d = e.def;
      if ((e.type === 'wolf' || e.type === 'wolf_alpha') && (e.state === 'crouch' || e.state === 'lock')) {
        const ang = e.state === 'crouch' ? e.aimAngle : e.dir, L = d.dashSpeed * d.dashTime, locked = e.state === 'lock';
        const alpha = locked ? (0.75 + 0.25 * Math.sin(st.t * 60)) : 0.4 + 0.35 * (e.stateT / d.crouch);
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(ang);
        ctx.fillStyle = `rgba(255,60,60,${alpha * 0.3})`; ctx.fillRect(0, -(e.r + st.player.r), L, (e.r + st.player.r) * 2);
        ctx.strokeStyle = `rgba(255,80,80,${alpha})`; ctx.lineWidth = locked ? 4 : 2; ctx.beginPath(); ctx.moveTo(e.r, 0); ctx.lineTo(L - 12, 0); ctx.stroke();

      }
      if (e.type === 'archer' && (e.state === 'aim' || e.state === 'lock')) {
        const ang = e.state === 'aim' ? e.aimAngle : e.dir, locked = e.state === 'lock', L = Math.hypot(a.w, a.h);
        ctx.strokeStyle = locked ? `rgba(255,80,80,${0.8 + 0.2 * Math.sin(st.t * 60)})` : `rgba(255,120,120,${0.35 + 0.35 * (e.stateT / d.aim)})`;
        ctx.lineWidth = locked ? 3 : 1.5; if (!locked) ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(ang) * L, e.y + Math.sin(ang) * L); ctx.stroke(); ctx.setLineDash([]);
        if (locked) { ctx.fillStyle = '#ff7070'; ctx.font = `bold 16px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', e.x, e.y - e.r - 24); }
      }
      if (e.type === 'spore' && e.state === 'swell') {
        const k = e.stateT / d.swell, r = d.cloudR * (0.3 + 0.7 * k);
        ctx.fillStyle = `rgba(200,100,255,${0.15 + 0.2 * k})`; ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = `rgba(255,120,255,${0.5 + 0.5 * k})`; ctx.lineWidth = 2 + 2 * k; ctx.beginPath(); ctx.arc(e.x, e.y, d.cloudR, 0, TAU); ctx.stroke();
      }
    }
    const bz = st.boss;

        const locked = bz.state === 'sweep_lock', ang = locked ? bz.dir : bz.aimAngle, half = cfg.sweep.arcDeg * Math.PI / 360;
        const alpha = locked ? flash : 0.35 + 0.35 * (bz.stateT / cfg.sweep.aim);
        ctx.fillStyle = `rgba(255,60,60,${alpha * 0.32})`; ctx.beginPath(); ctx.moveTo(bz.x, bz.y); ctx.arc(bz.x, bz.y, cfg.sweep.radius, ang - half, ang + half); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = `rgba(255,80,80,${alpha})`; ctx.lineWidth = locked ? 4 : 2; ctx.stroke();
        if (locked) { ctx.fillStyle = '#ff7070'; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', bz.x, bz.y - bz.r - 44); }
      }
      if (bz.state === 'dash_aim' || bz.state === 'dash_lock') {
        const locked = bz.state === 'dash_lock', ang = locked ? bz.dir : bz.aimAngle;
        const path = locked ? { len: bz.dashLen, end: bz.dashEnd } : PA.Boss.dashPath(st, bz, ang, cfg.dash.dist);
        const alpha = locked ? flash : 0.35 + 0.35 * (bz.stateT / cfg.dash.aim), W = (bz.r + st.player.r) * 2;
        ctx.save(); ctx.translate(bz.x, bz.y); ctx.rotate(ang);
        ctx.fillStyle = `rgba(255,60,60,${alpha * 0.3})`; ctx.fillRect(0, -W / 2, path.len, W);
        ctx.strokeStyle = `rgba(255,80,80,${alpha})`; ctx.lineWidth = locked ? 4 : 2; ctx.strokeRect(0, -W / 2, path.len, W);
        ctx.beginPath(); ctx.moveTo(bz.r, 0); ctx.lineTo(path.len - 14, 0); ctx.stroke();
        ctx.fillStyle = `rgba(255,80,80,${alpha})`; ctx.beginPath(); ctx.moveTo(path.len, 0); ctx.lineTo(path.len - 18, -10); ctx.lineTo(path.len - 18, 10); ctx.closePath(); ctx.fill();
        ctx.restore();
        // 도착 지점
        ctx.strokeStyle = `rgba(255,120,120,${alpha})`; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(path.end.x, path.end.y, bz.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
        if (locked) { ctx.fillStyle = '#ff7070'; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', bz.x, bz.y - bz.r - 44); }
        if (bz.dashTotal > 1) { ctx.fillStyle = '#ffd166'; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(`연속 돌진 ${bz.dashSeq}/${bz.dashTotal}`, bz.x, bz.y - bz.r - 60); }
      }
      if ((bz.state === 'pounce_aim' || bz.state === 'pounce_lock' || bz.state === 'leap') && bz.land) {
        const locked = bz.state !== 'pounce_aim', alpha = locked ? flash : 0.35 + 0.35 * (bz.stateT / cfg.pounce.aim);
        ctx.fillStyle = `rgba(255,60,60,${alpha * 0.3})`; ctx.beginPath(); ctx.arc(bz.land.x, bz.land.y, cfg.pounce.radius, 0, TAU); ctx.fill();
        ctx.strokeStyle = `rgba(255,80,80,${alpha})`; ctx.lineWidth = locked ? 4 : 2; ctx.stroke();
        if (bz.state === 'leap') { const k = bz.leapK; ctx.strokeStyle = 'rgba(255,200,120,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bz.land.x, bz.land.y, cfg.pounce.radius * (1 - k) + 6, 0, TAU); ctx.stroke(); }
        if (locked && bz.state !== 'leap') { ctx.fillStyle = '#ff7070'; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', bz.land.x, bz.land.y - cfg.pounce.radius - 10); }
      }
      if (bz.state === 'howl') { const k = bz.stateT / cfg.howl.duration; ctx.strokeStyle = `rgba(255,200,120,${0.6 * (1 - k)})`; ctx.lineWidth = 3; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(bz.x, bz.y - 20, 40 + ((k * 3 + i) % 3) * 40, 0, TAU); ctx.stroke(); } }
    }
    for (const f of st.effects) if (f.kind === 'pawwarn') {
      const k = f.t / f.ttl; ctx.fillStyle = `rgba(255,200,80,${0.4 + 0.6 * k})`;
      ctx.beginPath(); ctx.ellipse(f.x, f.y + 3, 6, 8, 0, 0, TAU); ctx.fill(); for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(f.x - 7 + i * 4.7, f.y - 8 + (i === 0 || i === 3 ? 3 : 0), 2.6, 0, TAU); ctx.fill(); }
      ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('늑대 등장', f.x, f.y - 18);
    }
    for (const f of st.effects) if (f.kind === 'spawnwarn') {
      const k = f.t / f.ttl; ctx.strokeStyle = `rgba(255,200,80,${0.4 + 0.6 * k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 18 * (1 - k) + 6, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,200,80,0.9)'; ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(PA.ENEMIES[f.type].name, f.x, f.y - 24);
    }
  }

  function drawProjectiles(ctx, st) {
    for (const p of st.projectiles) {
      if (p.kind === 'arrow') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle); ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(8, 0); ctx.stroke(); ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(4, -4); ctx.lineTo(4, 4); ctx.fill(); ctx.restore(); }
      else { ctx.fillStyle = '#bfefff'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(191,239,255,0.4)'; ctx.beginPath(); ctx.arc(p.x - p.vx * 0.02, p.y - p.vy * 0.02, 3, 0, TAU); ctx.fill(); }
    }
  }

  function drawPickups(ctx, st) {
    for (const k of st.pickups) {
      const bob = Math.sin(k.t * 4) * 3;
      ctx.fillStyle = 'rgba(120,255,160,0.25)'; ctx.beginPath(); ctx.arc(k.x, k.y + bob, k.r + 6 + Math.sin(k.t * 6) * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7fe8a0'; ctx.beginPath(); ctx.arc(k.x, k.y + bob, k.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(k.x - 4, k.y + bob - 4, 4, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#1e4a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(k.x - 6, k.y + bob); ctx.lineTo(k.x + 6, k.y + bob); ctx.moveTo(k.x, k.y + bob - 6); ctx.lineTo(k.x, k.y + bob + 6); ctx.stroke();
      ctx.fillStyle = '#bfffd0'; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('+' + k.amount, k.x, k.y + bob - k.r - 6);
    }
  }
  function drawMisc(ctx, st) {
    for (const f of st.effects) {
      const k = 1 - f.t / f.ttl;
      if (f.kind === 'bosssweep') { ctx.globalAlpha = k; ctx.fillStyle = 'rgba(255,120,80,0.35)'; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, f.angle - f.half, f.angle + f.half); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#ffd9b0'; ctx.lineWidth = 6 * k; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + 0.4 * (1 - k)), f.angle - f.half, f.angle + f.half); ctx.stroke(); ctx.globalAlpha = 1; }
      if (f.kind === 'bossland') { ctx.globalAlpha = k; ctx.fillStyle = 'rgba(200,150,90,0.35)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + 0.4 * (1 - k)), 0, TAU); ctx.fill(); ctx.strokeStyle = '#e8c9a0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.2), 0, TAU); ctx.stroke(); for (let i = 0; i < 10; i++) { const a = i * TAU / 10; ctx.fillStyle = '#8a6b45'; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * f.r * (1 - k) * 0.9, f.y + Math.sin(a) * f.r * (1 - k) * 0.9 - 14 * k, 3, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
      if (f.kind === 'burst') { ctx.strokeStyle = f.color; ctx.globalAlpha = k; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.6), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
      if (f.kind === 'death') { ctx.globalAlpha = k * 0.8; ctx.fillStyle = '#6b6f78'; for (let i = 0; i < 7; i++) { const a = i * TAU / 7 + 0.3; const dd = f.r * (0.6 + 1.8 * (1 - k)); ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * dd, f.y + Math.sin(a) * dd - 10 * (1 - k), 3 * k + 1, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
      if (f.kind === 'spark') { ctx.globalAlpha = k; ctx.strokeStyle = f.crit ? '#ffd166' : '#ffffff'; ctx.lineWidth = 2; for (let i = 0; i < 5; i++) { const a = f.angle + (i - 2) * 0.5; const r0 = 6 + 14 * (1 - k), r1 = r0 + 6; ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0); ctx.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1); ctx.stroke(); } ctx.globalAlpha = 1; }
      if (f.kind === 'flare') { ctx.globalAlpha = k * 0.6; ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + 0.5 * (1 - k)), 0, TAU); ctx.fill(); ctx.globalAlpha = k; ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.3), 0, TAU); ctx.stroke(); for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.fillStyle = '#ffcc55'; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * f.r * (1 - k) * 1.1, f.y + Math.sin(a) * f.r * (1 - k) * 1.1, 3, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
      if (f.kind === 'stasisburst') { ctx.globalAlpha = k; ctx.fillStyle = 'rgba(160,210,255,0.35)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.4), 0, TAU); ctx.fill(); ctx.strokeStyle = '#e0f4ff'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + 0.4; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + Math.cos(a) * f.r * (1.2 - k * 0.5), f.y + Math.sin(a) * f.r * (1.2 - k * 0.5)); ctx.stroke(); } ctx.globalAlpha = 1; }
      if (f.kind === 'fieldend') { ctx.globalAlpha = k * 0.7; ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 6 * k; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + 0.15 * (1 - k)), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
      if (f.kind === 'hitflash') { ctx.globalAlpha = k * 0.5; ctx.strokeStyle = '#ff5050'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 18 + 16 * (1 - k), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    for (const f of st.effects) if (f.kind === 'text') { ctx.globalAlpha = Math.min(1, (1 - f.t / f.ttl) * 2); ctx.font = `bold 15px ${FONT}`; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1; }
  }

  function bar(ctx, x, y, w, h, ratio, color, label, text) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#fff'; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(label, x + 6, y + h - 5);
    ctx.textAlign = 'right'; ctx.fillText(text, x + w - 6, y + h - 5);
  }
  function slot(ctx, x, y, key, label, ready, ratio, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(x, y, 64, 64);
    ctx.strokeStyle = ready ? color : 'rgba(255,255,255,0.35)'; ctx.lineWidth = ready ? 3 : 1.5; ctx.strokeRect(x + 1.5, y + 1.5, 61, 61);
    if (!ready) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, 64, 64); ctx.clip(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.moveTo(x + 32, y + 32); ctx.arc(x + 32, y + 32, 48, -Math.PI / 2, -Math.PI / 2 + TAU * ratio); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = ready ? '#fff' : 'rgba(255,255,255,0.6)'; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(key, x + 32, y + 30);
    ctx.font = `12px ${FONT}`; ctx.fillText(label, x + 32, y + 52);
  }
  function drawHUD(ctx, st, W, H) {
    const p = st.player, b = st.build;
    bar(ctx, 14, 12, 240, 22, p.hp / p.hpMax, '#d9453d', '체력', `${Math.ceil(p.hp)} / ${p.hpMax}`);
    if (p.shieldMax > 0) bar(ctx, 14, 38, 240, 16, p.shield / p.shieldMax, '#38c6d8', '보호막', `${Math.ceil(p.shield)} / ${p.shieldMax}`);
    const alive = st.enemies.filter(e => !e.dead).length + st.pending.length;
    if (st.mode === 'boss' && st.boss) {
      const bz = st.boss, cfg = PA.BOSS, bw = 520, bx = W / 2 - bw / 2, by = 14;
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(bx - 10, by - 4, bw + 20, 58);
      ctx.fillStyle = '#ffe066'; ctx.font = `bold 15px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(`${cfg.name} — ${cfg.title}`, bx, by + 12);
      const act = PA.BOSS_ACTION_TEXT[bz.state] || ''; const slow = PA.Combat.inField(st, bz) && !bz.dead;
      let actText = act; if (bz.state === 'dash_aim' || bz.state === 'dash_lock' || bz.state === 'dash') { if (bz.dashTotal > 1) actText = `연속 돌진 ${bz.dashSeq}/${bz.dashTotal}` + (bz.state === 'dash_aim' ? ' 준비' : ''); }
      ctx.fillStyle = (bz.state === 'recover' || bz.state === 'stagger') ? '#ffd166' : '#fff'; ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'right'; ctx.fillText(actText + (slow ? ' · 감속 중' : ''), bx + bw, by + 12);
      ctx.fillStyle = '#2a0f0f'; ctx.fillRect(bx, by + 20, bw, 18);
      const ratio = Math.max(0, bz.hp / bz.hpMax);
      ctx.fillStyle = bz.phase >= 3 ? '#ff5a3c' : bz.phase === 2 ? '#e0563a' : '#c0392b'; ctx.fillRect(bx, by + 20, bw * ratio, 18);
      for (const ph of cfg.phases) { const px = bx + bw * ph; ctx.fillStyle = '#fff'; ctx.fillRect(px - 1, by + 18, 2, 22); ctx.font = `11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd9b0'; ctx.fillText(Math.round(ph * 100) + '%', px, by + 50); }
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 20.5, bw - 1, 17);
      ctx.fillStyle = '#fff'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(`${Math.ceil(Math.max(0, bz.hp))} / ${bz.hpMax} · ${bz.phase}단계`, bx + bw / 2, by + 34);
      if (alive - 1 > 0) { ctx.font = `12px ${FONT}`; ctx.fillStyle = '#ddd'; ctx.textAlign = 'left'; ctx.fillText(`소환 늑대 ${alive - 1}`, bx, by + 50); }
      if (st.intro > 0) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H / 2 - 50, W, 100); ctx.fillStyle = '#ffe066'; ctx.font = `bold 36px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(`${cfg.name} — ${cfg.title}`, W / 2, H / 2 + 2); ctx.fillStyle = '#fff'; ctx.font = `14px ${FONT}`; ctx.fillText('예언의 날. 숲의 왕이 나타났다.', W / 2, H / 2 + 30); }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W - 214, 12, 200, 46);
      ctx.fillStyle = '#fff'; ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(st.objective === 'elite' ? '목적: 정예 처치' : '목적: 전멸', W - 204, 31);
      ctx.font = `13px ${FONT}`; ctx.fillStyle = '#ddd'; ctx.fillText(`웨이브 ${Math.max(1, st.waveIndex + 1)}/${st.waves.length} · 남은 적 ${alive}`, W - 204, 50);
    }
    const cfg = PA.CONFIG.PLAYER, dodgeCd = cfg.dodge.cooldown * b.dodgeCdMult;
    slot(ctx, W / 2 - 70, H - 78, 'Space', '회피', !p.dodge.active && p.dodge.cd <= 0, p.dodge.active ? 1 : Math.max(0, p.dodge.cd) / dodgeCd, '#7ef2ff');
    slot(ctx, W / 2 + 6, H - 78, 'Q', '감속장', p.special.cd <= 0, p.special.cd / b.specialCd, '#a9d8ff');
    if (p.special.cd > 0) { ctx.fillStyle = '#fff'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(p.special.cd.toFixed(1) + 's', W / 2 + 38, H - 84); }
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(14, H - 40, 360, 28);
    ctx.fillStyle = '#fff'; ctx.font = `13px ${FONT}`; ctx.textAlign = 'left';
    const augs = Object.keys(b.aug).filter(k => b.aug[k] > 0).map(k => PA.AUGMENTS.find(x => x.id === k).name + (b.aug[k] > 1 ? b.aug[k] : '')).join(', ');
    ctx.fillText(`${b.weapon.name} · 피해 ${PA.fmt.num(b.damage)} · 주기 ${PA.fmt.num(b.interval)}s` + (augs ? ' · ' + augs : ''), 20, H - 21);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = `12px ${FONT}`; ctx.textAlign = 'right'; ctx.fillText(PA.KEYS_TEXT, W - 14, H - 18);
    if (st.status !== 'running') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = st.status === 'won' ? '#ffe066' : '#ff6b6b'; ctx.font = `bold 40px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(st.status === 'won' ? (st.mode === 'boss' ? '숲의 왕을 쓰러뜨렸다' : '조우 승리') : '패배', W / 2, H / 2 - 10);
    }
  }
  function drawDebug(ctx, st) {
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(st.player.x, st.player.y, st.player.r, 0, TAU); ctx.stroke();
    for (const e of st.enemies) { if (e.dead) continue; ctx.strokeStyle = '#f0f'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke(); ctx.fillStyle = '#0f0'; ctx.font = '10px monospace'; ctx.textAlign = 'left'; ctx.fillText(`${e.type} ${e.state} ${e.stateT.toFixed(2)} hp${Math.round(e.hp)}`, e.x + e.r + 2, e.y); }
    for (const p of st.projectiles) { ctx.strokeStyle = '#ff0'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
    for (const ob of st.obstacles) { ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r, 0, TAU); ctx.stroke(); ctx.fillStyle = '#0ff'; ctx.font = '10px monospace'; ctx.fillText(`${ob.id || ob.type} r${ob.r}`, ob.x - 20, ob.y - ob.r - 4); }
    ctx.fillStyle = '#0f0'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`t=${st.t.toFixed(2)} seed=${st.seed} enemies=${st.enemies.length} proj=${st.projectiles.length} zones=${st.zones.length} fx=${st.effects.length} dodge=${st.player.dodge.active} cd=${st.player.dodge.cd.toFixed(2)} prot=${st.player.hitProt.toFixed(2)} atk=${st.player.attackTimer.toFixed(2)}`, 14, 76);
  }

  function draw(ctx, st, opts) {
    opts = opts || {};
    const pad = PA.CONFIG.VIEW.pad, W = st.arena.w + pad * 2, H = st.arena.h + pad * 2;
    ctx.save(); ctx.translate(pad, pad);
    drawForest(ctx, st);
    drawObstacles(ctx, st);
    drawZones(ctx, st);
    drawChest(ctx, st);
    drawPickups(ctx, st);
    drawRange(ctx, st);
    drawPlayerEffects(ctx, st);
    // 개체는 y순으로 그려 겹침이 자연스럽게
    const ents = st.enemies.map(e => ({ y: e.y, f: () => drawEnemy(ctx, st, e) }));
    ents.push({ y: st.player.y, f: () => drawSwordsman(ctx, st) });
    ents.sort((a, b) => a.y - b.y); for (const o of ents) o.f();
    drawCanopies(ctx, st);       // 수관은 개체 위, 예고선 아래(가까우면 투명)
    drawTelegraphs(ctx, st);   // 예고는 내 이펙트와 캐릭터 위
    drawProjectiles(ctx, st);
    drawMisc(ctx, st);
    if (opts.debug) drawDebug(ctx, st);
    ctx.restore();
    drawHUD(ctx, st, W, H);
  }
  return { draw, FONT, drawBoss };
})();

</script>
<script>
// DOM 화면(전투 밖). HTML 문자열을 만들고 data-action으로 main에 동작을 위임한다.
var PA = (typeof PA !== 'undefined') ? PA : {};

PA.Screens = (function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const R = () => PA.Run;
  const stars = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
  const matName = (k) => PA.MATERIALS[k].name;
  const hoursPips = (h, max) => `<span class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < h ? 'on' : ''}"></i>`).join('')}</span>`;
  const costText = (cost) => `금화 ${cost.gold}` + Object.keys(cost.mats || {}).map(k => ` + ${matName(k)} ${cost.mats[k]}`).join('');

  function header(run) {
    const b = R().build(run), left = R().bossDaysLeft(run);
    const bossPct = Math.round(((run.day - 1) / (PA.CONFIG.BOSS_DAY - 1)) * 100);
    return `<div class="topbar">
      <div class="stat"><span class="lbl">날짜</span><b>${run.day}일차</b></div>
      <div class="stat"><span class="lbl">오늘 남은 시간</span><b>${run.hours} / ${PA.CONFIG.HOURS_PER_DAY}시간</b> ${hoursPips(run.hours, PA.CONFIG.HOURS_PER_DAY)}</div>
      <div class="stat boss"><span class="lbl">보스 도래까지</span><b class="${left <= 2 ? 'warn' : ''}">${left > 0 ? left + '일' : '오늘'}</b><span class="bossbar"><i style="width:${bossPct}%"></i></span></div>
      <div class="stat"><span class="lbl">체력</span><b>${run.hp} / ${b.hpMax}</b></div>
      <div class="stat"><span class="lbl">금화</span><b class="gold">${run.gold}</b></div>
    </div>`;
  }
  function matsRow(run) {
    return `<div class="mats">${Object.keys(PA.MATERIALS).map(k => `<span class="mat ${run.mats[k] ? '' : 'zero'}">${matName(k)} <b>${run.mats[k] || 0}</b></span>`).join('')}</div>`;
  }
  function targetCard(run) {
    const t = R().targetInfo(run);
    if (!t) return `<div class="card target"><div class="card-title">목표 장비</div><p>목표가 없습니다. 상점·대장간에서 정하세요.</p><button data-action="shop">상점·대장간</button></div>`;
    const needs = t.needs.length ? `<ul class="needs">${t.needs.map(n => `<li><b>${esc(n.name)} ${n.need}</b> 부족 · 획득: ${n.where.join(', ')}</li>`).join('')}</ul>` : `<p class="ok">재료와 금화가 모두 준비되었습니다. 상점·대장간에서 ${t.item.slot === 'upgrade' ? '강화' : '제작'}하세요.</p>`;
    return `<div class="card target"><div class="card-title">목표 장비: ${esc(t.item.name)} <span class="sub">${esc(t.item.short)}</span></div>

  }
  // 다가오는 보스 정보(준비 기간부터 공개)
  function bossCard(run, full) {
    const B = PA.BOSS, left = R().bossDaysLeft(run);

    return `<div class="card boss"><div class="card-title">다가오는 보스: ${esc(B.name)} — ${esc(B.title)} <span class="tag">${when}</span></div>
      <div class="bossart"><canvas class="bossportrait" width="160" height="90"></canvas><div><p>숲과 늑대 무리를 지배하는 거대한 늑대. 목과 등에 부러진 나뭇가지 같은 검은 가시가 돋았고, 한쪽 송곳니가 부러졌다.</p>
      <ul class="tips">${B.info.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      ${full ? `<p class="dim small">전장: ${esc(PA.ARENAS.clearing.name)} · 바위 2, 나무 2 · 체력 ${B.hp} · 단계 전환 70%·35% · 시간제한 없음</p>` : ''}</div></div></div>`;
  }
  function gearPanel(run) {

    const accBtns = accs.map(id => g.acc === id ? `<span class="tag">${esc(R().item(id).name)} 장착 중</span>` : `<button class="mini" data-action="equip" data-arg="${id}">${esc(R().item(id).name)} 장착</button>`).join(' ');
    const armorBtns = armors.map(id => g.armor === id ? `<span class="tag">${esc(R().item(id).name)} 장착 중</span>` : `<button class="mini" data-action="equip" data-arg="${id}">${esc(R().item(id).name)} 장착</button>`).join(' ');
    return `<div class="card"><div class="card-title">장비 교체 <span class="sub">추가 비용 없음</span></div>
      <div class="kv"><span>무기</span><b>${g.weapon === 'pierce' ? '관통검' : '기본검'}${g.upgrade ? ' +' + g.upgrade : ''}</b> ${run.owned.includes('pierce_sword') ? `<button class="mini" data-action="toggle-weapon">${g.weapon === 'pierce' ? '기본검으로' : '관통검으로'}</button>` : '<span class="dim small">관통검 미보유</span>'}</div>
      <div class="kv"><span>방어구</span>${armorBtns || '<span class="dim">보유 없음</span>'}${g.armor ? ` <button class="mini" data-action="unequip" data-arg="armor">해제</button>` : ''}</div>
      <div class="kv"><span>장신구</span>${accBtns || '<span class="dim">보유 없음</span>'}${g.acc ? ` <button class="mini" data-action="unequip" data-arg="acc">해제</button>` : ''}</div></div>`;
  }
  function buildPanel(run) {
    const b = R().build(run), g = run.gear;
    const augs = Object.keys(run.augments).filter(k => run.augments[k] > 0).map(k => { const d = PA.AUGMENTS.find(a => a.id === k); return `<li><b>${esc(d.name)}</b>${d.max > 1 ? ` ${run.augments[k]}단계` : ''} <span class="dim">${esc(d.desc)}</span></li>`; }).join('');
    return `<div class="card"><div class="card-title">현재 빌드</div>
      <ul class="gear">
        <li>무기: <b>${esc(b.weapon.name)}${g.upgrade ? ' +' + g.upgrade : ''}</b> <span class="dim">${b.weapon.form === 'beam' ? '관통 직선' : '부채꼴'} · 피해 ${PA.fmt.num(b.damage)} · 주기 ${PA.fmt.num(b.interval)}초 · 범위 ${Math.round(b.range)}</span>${run.owned.includes('pierce_sword') ? ` <button class="mini" data-action="toggle-weapon">${g.weapon === 'pierce' ? '기본검으로' : '관통검으로'}</button>` : ''}</li>
        <li>방어구: <b>${g.armor ? esc(R().item(g.armor).name) : '없음'}</b> <span class="dim">최대 체력 ${b.hpMax}</span></li>

        <li>수동 특수기(Q): <b>감속장</b> <span class="dim">반지름 150 · 3초 · 적 속도 40%</span></li>

      <div class="card-title small">증강 (회차 동안 유지)</div>${augs ? `<ul class="augs">${augs}</ul>` : '<p class="dim">아직 없음. 조우 승리 시 선택합니다.</p>'}</div>`;
  }

  function title(G) {
    const hasSave = !!G.saved;
    return `<div class="screen center"><h1>예언의 시간표</h1><p class="subtitle">액션 프로토타입 · 마검사의 준비 기간</p>
      <div class="menu">
        ${hasSave ? `<button class="primary big" data-action="continue">계속하기 <span class="dim">(${G.saved.day}일차 · 금화 ${G.saved.gold})</span></button>` : ''}
        <button class="big ${hasSave ? '' : 'primary'}" data-action="newrun">새 회차</button>
        <button class="big" data-action="controls">조작법</button>
      </div>
      <p class="dim small">${esc(PA.KEYS_TEXT)}</p><p class="dim small">v${PA.VERSION}</p></div>`;
  }
  function newrunConfirm() {
    return `<div class="screen center"><h2>새 회차를 시작할까요?</h2><p>기존 저장(진행 중인 회차)이 덮어씌워집니다.</p><div class="row"><button class="primary" data-action="newrun-confirm">새 회차 시작</button><button data-action="title">돌아가기</button></div></div>`;
  }
  function finalPrep(G) {
    const run = G.run, b = R().build(run), cleared = run.phase === 'cleared';
    const rec = run.bossClear;
    return `<div class="screen">${header(run)}
      <h2>${run.day}일차 — ${cleared ? '예언의 날을 넘겼다' : '최종 준비'}</h2>
      <p class="dim">오늘은 일반 출격이 없습니다. 보유 자금으로 구매·강화하고, 재료를 팔고, 장비를 교체한 뒤 보스에게 갑니다. 입장 시 체력·회피·감속장·방벽이 모두 준비된 상태로 시작합니다.</p>
      ${cleared && rec ? `<div class="card ok"><div class="card-title">첫 처치 기록</div><p>${rec.time}초 · 재도전 ${rec.retries}회 · ${esc(rec.weapon)}${rec.upgrade ? ' +' + rec.upgrade : ''} · 보스에게 준 피해 ${rec.bossDamage}</p></div>` : ''}
      <div class="grid2"><div>
        ${bossCard(run, true)}
        <div class="card"><div class="card-title">준비</div><div class="actions">
          <button class="primary big" data-action="boss-start">${cleared ? '이번 빌드로 보스 다시 도전' : '보스에게 간다 (입장)'}</button>
          <button class="big" data-action="shop">상점 · 대장간 · 재료 판매</button>
          ${cleared ? '<button class="big" data-action="newrun-confirm">새 회차 시작</button>' : ''}
          <button data-action="save-quit">저장 후 종료</button></div></div>
        <div class="card"><div class="card-title">재료</div>${matsRow(run)}</div>
      </div><div>${gearPanel(run)}${buildPanel(run)}
        <div class="card"><div class="card-title">최근 기록</div>${run.log.length ? `<ul class="log">${run.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<p class="dim">아직 없음</p>'}</div>
      </div></div></div>`;
  }
  function base(G) {
    const run = G.run;
    if (run.phase !== 'prep') return finalPrep(G);
    const canRest = R().canRest(run);
    return `<div class="screen">${header(run)}
      <div class="grid2">
        <div>
          ${targetCard(run)}
          ${bossCard(run, false)}
          <div class="card"><div class="card-title">오늘 할 일</div>
            <div class="actions">
              <button class="primary big" data-action="map">출격 · 지역 선택</button>
              <button class="big" data-action="shop">상점 · 대장간</button>
              <button class="big" data-action="rest" ${canRest ? '' : 'disabled'}>휴식 (1시간, 체력 완전 회복)${canRest ? '' : run.hp >= R().build(run).hpMax ? ' · 체력 가득' : ' · 시간 부족'}</button>
              <button class="big" data-action="endday-confirm">하루 종료 → ${run.day + 1}일차${run.day + 1 >= PA.CONFIG.BOSS_DAY ? ' <span class="warn">(보스 도래)</span>' : ''}${run.hours > 0 ? ` <span class="dim">(남은 ${run.hours}시간 버림)</span>` : ''}</button>
              <button data-action="save-quit">저장 후 종료</button>
            </div></div>
          <div class="card"><div class="card-title">재료</div>${matsRow(run)}<p class="dim small">재료는 상점에서 팔 수 있습니다. 제작에 쓸지 현금으로 바꿀지 선택하세요.</p></div>
        </div>
        <div>
          ${buildPanel(run)}
          <div class="card"><div class="card-title">최근 기록</div>${run.log.length ? `<ul class="log">${run.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<p class="dim">아직 없음</p>'}</div>
        </div>
      </div></div>`;
  }
  function map(G) {
    const run = G.run, t = R().targetInfo(run);
    const needKinds = t ? t.needs.map(n => n.kind) : [];
    const cards = PA.REGIONS.map(r => {
      const can = R().canSortie(run, r.id);
      const rewardText = `금화 ${r.reward.gold[0]}~${r.reward.gold[1]}` + Object.keys(r.reward.mats).map(k => `, ${matName(k)} ${k === 'fang' ? '(정예 처치 시 1)' : r.reward.mats[k][0] + '~' + r.reward.mats[k][1]}`).join('');
      const forTarget = Object.keys(r.reward.mats).some(k => needKinds.includes(k)) || (needKinds.includes('gold'));
      const enemies = r.enemies.map(id => `<li><b>${esc(PA.ENEMIES[id].name)}</b> <span class="dim">${esc(PA.ENEMIES[id].role)} — ${esc(PA.ENEMIES[id].readme)}</span></li>`).join('');
      return `<div class="card region ${can ? '' : 'off'}">
        <div class="card-title">${esc(r.name)} <span class="risk">위험 ${stars(r.risk)}</span> <span class="cost-badge">${r.cost}시간</span></div>
        <p>${esc(r.desc)}</p>
        <div class="kv"><span>목적</span><b>${r.objective === 'elite' ? '정예 처치' : '전멸'} · ${r.waves.length}웨이브</b></div>
        <div class="kv"><span>보상</span><b>${rewardText}</b>${forTarget ? ' <span class="tag">목표 장비 재료</span>' : ''}</div>
        <ul class="enemies">${enemies}</ul>
        <button class="primary" data-action="sortie" data-arg="${r.id}" ${can ? '' : 'disabled'}>${can ? `출격 (${r.cost}시간 사용 → ${run.hours - r.cost}시간 남음)` : run.phase !== 'prep' ? '7일차: 출격 종료' : '시간 부족'}</button>
      </div>`;
    }).join('');
    return `<div class="screen">${header(run)}
      <div class="row between"><h2>지역 선택</h2><button data-action="base">거점으로</button></div>
      <p class="dim">출격 비용은 출발 시 차감됩니다. 전투가 오래 걸려도 추가로 시간을 빼지 않습니다. 조우 승리 후 "더 깊이 탐험"은 별도로 1시간을 씁니다.</p>
      <div class="grid3">${cards}</div></div>`;
  }
  function previewRows(run, patch) {
    const a = R().build(run), b = PA.Build.preview(run, patch);
    const rows = [];
    const add = (name, x, y, fmt) => { if (Math.abs(x - y) > 1e-6) rows.push(`<li>${name}: <span class="dim">${fmt(x)}</span> → <b>${fmt(y)}</b></li>`); };
    add('피해', a.damage, b.damage, v => PA.fmt.num(v));
    add('늑대 처치 타격 수', PA.Build.hitsToKill(a, 'wolf'), PA.Build.hitsToKill(b, 'wolf'), v => v + '타');
    add('우두머리 처치 타격 수', PA.Build.hitsToKill(a, 'wolf_alpha'), PA.Build.hitsToKill(b, 'wolf_alpha'), v => v + '타');
    add('공격 주기', a.interval, b.interval, v => PA.fmt.num(v) + '초');
    add('범위', a.range, b.range, v => Math.round(v));
    add('최대 체력', a.hpMax, b.hpMax, v => v);
    add('회피 재사용', PA.CONFIG.PLAYER.dodge.cooldown * a.dodgeCdMult, PA.CONFIG.PLAYER.dodge.cooldown * b.dodgeCdMult, v => PA.fmt.num(v) + '초');
    add('감속장 재사용', a.specialCd, b.specialCd, v => v + '초');
    add('빈틈 피해 배율', a.exposedMult, b.exposedMult, v => '×' + v);
    if (a.weapon.form !== b.weapon.form) rows.push(`<li>공격 형태: <span class="dim">${a.weapon.form === 'beam' ? '관통 직선' : '부채꼴'}</span> → <b>${b.weapon.form === 'beam' ? '관통 직선 (길이 ' + Math.round(b.range) + ', 폭 ' + b.weapon.width + ')' : '부채꼴'}</b></li>`);
    return rows.length ? `<ul class="preview">${rows.join('')}</ul>` : '<p class="dim small">수치 변화 없음</p>';
  }
  function itemPatch(run, it) {
    if (it.slot === 'upgrade') return { gear: { upgrade: run.gear.upgrade + 1 } };
    if (it.slot === 'weapon') return { gear: { weapon: 'pierce' } };
    if (it.slot === 'armor') return { gear: { armor: it.id } };
    return { gear: { acc: it.id } };
  }
  function shop(G) {
    const run = G.run;
    const items = PA.ITEMS.map(it => {
      const avail = R().itemAvailable(run, it);
      if (!avail) return `<div class="card item done"><div class="card-title">${esc(it.name)} <span class="tag">보유</span></div><p class="dim">${esc(it.desc)}</p></div>`;
      const cost = R().itemCost(run, it), s = R().shortfall(run, it), can = R().canBuy(run, it);
      const costHtml = `<span class="${s.gold > 0 ? 'lack' : ''}">금화 ${cost.gold}${s.gold > 0 ? ` (${s.gold} 부족)` : ''}</span>` + Object.keys(cost.mats || {}).map(k => ` + <span class="${s.mats[k] ? 'lack' : ''}">${matName(k)} ${cost.mats[k]}${s.mats[k] ? ` (${s.mats[k]} 부족 · ${PA.MATERIALS[k].where.map(id => R().region(id).name).join('/')})` : ''}</span>`).join('');
      const name = it.slot === 'upgrade' ? `${it.name} +${run.gear.upgrade + 1}` : it.name;
      return `<div class="card item ${can ? 'can' : ''}"><div class="card-title">${esc(name)} <span class="sub">${esc(it.short)}</span>${run.target === it.id ? ' <span class="tag">목표</span>' : ''}</div>
        <p>${esc(it.desc)}</p><div class="cost">${costHtml}</div>
        <div class="card-title small">구매 시 변화</div>${previewRows(run, itemPatch(run, it))}
        <div class="row"><button class="primary" data-action="buy" data-arg="${it.id}" ${can ? '' : 'disabled'}>${it.slot === 'upgrade' ? '강화' : it.slot === 'weapon' ? '제작' : '구매'}</button>${run.target !== it.id ? `<button data-action="target" data-arg="${it.id}">목표로 지정</button>` : ''}</div></div>`;
    }).join('');
    const sells = Object.keys(PA.MATERIALS).map(k => `<div class="sellrow"><span>${matName(k)} <b>${run.mats[k] || 0}</b> <span class="dim">(개당 ${PA.MATERIALS[k].sell}금)</span></span><button class="mini" data-action="sell" data-arg="${k}" ${run.mats[k] ? '' : 'disabled'}>1개 판매</button></div>`).join('');
    return `<div class="screen">${header(run)}
      <div class="row between"><h2>상점 · 대장간</h2><button data-action="base">거점으로</button></div>
      <p class="dim">살 수 없어도 전 목록이 보입니다. 부족한 것은 붉게, 획득 지역과 함께 표시됩니다. 구매·제작은 즉시 장착되어 다음 전투에 반영됩니다.</p>
      ${matsRow(run)}
      <div class="grid3">${items}</div>
      <div class="card"><div class="card-title">재료 판매</div>${sells}</div>
      ${buildPanel(run)}</div>`;
  }
  function reward(G) {
    const run = G.run, rw = G.lastReward, offers = G.offers || [];
    const matText = Object.keys(rw.mats).map(k => `${matName(k)} ${rw.mats[k]}`).join(', ');
    const cards = offers.map(a => `<div class="card aug"><div class="card-title">${esc(a.name)} <span class="kind">${esc(a.kind)}</span></div>
      <p class="big-desc">${esc(a.desc)}</p><p class="dim">${esc(a.long)}</p>
      <div class="connect">연결: ${esc(PA.Build.connectionText(run, a) || '—')}${a.connect ? ` <span class="tag">${esc(a.connect)}</span>` : ''}</div>
      <button class="primary" data-action="pick" data-arg="${a.id}">선택</button></div>`).join('');
    return `<div class="screen"><h2>조우 승리</h2>
      <div class="card"><div class="card-title">보상 (귀환 시 거점에 반영)</div>
