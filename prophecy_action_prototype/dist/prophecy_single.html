      <div class="row"><button data-action="skip">건너뛰기 (금화 +${PA.CONFIG.SKIP_AUGMENT_GOLD})</button></div></div>`;
  }
  function after(G) {
    const run = G.run, s = G.sortie, r = R().region(s.regionId), b = R().build(run);
    const canDeep = !s.deep && R().canDeepExplore(run);
    const lootText = `금화 ${s.loot.gold}` + Object.keys(s.loot.mats).map(k => `, ${matName(k)} ${s.loot.mats[k]}`).join('');
    return `<div class="screen center"><h2>${esc(r.name)} · 다음 행동</h2>
      <p>체력 <b>${run.hp} / ${b.hpMax}</b> · 이번 출격 전리품: <b>${lootText}</b> · 오늘 남은 시간 <b>${run.hours}</b></p>
      <div class="menu">
        <button class="big ${canDeep ? '' : 'off'}" data-action="deep" ${canDeep ? '' : 'disabled'}>더 깊이 탐험 (+1시간) <span class="dim">적 수 +1, 마지막에 정예. 보상 ×${PA.CONFIG.DEEP_REWARD_MULT}${s.deep ? ' · 이미 탐험함' : (canDeep ? '' : ' · 시간 부족')}</span></button>
        <button class="primary big" data-action="return">귀환 (전리품 확정)</button>
      </div><p class="dim small">패배하면 이번 출격의 전리품을 잃습니다.</p></div>`;
  }
  function defeat(G) {
    const run = G.run, r = R().region(G.sortie.regionId);
    return `<div class="screen center"><h2 class="bad">패배</h2><p>${esc(r.name)}에서 쓰러졌습니다. 이번 출격의 전리품을 잃었고, 부상 치료로 1시간을 썼습니다.</p>
      <p>체력 ${run.hp} · 오늘 남은 시간 ${run.hours} · 증강과 장비는 유지됩니다.</p>
      <p class="dim small">처치 ${G.lastStats.kills} · 받은 피해 ${Math.round(G.lastStats.damageTaken)} · ${Math.round(G.lastStats.elapsed)}초</p>
      <button class="primary big" data-action="base">거점으로</button></div>`;
  }
  function bossDefeat(G) {
    const run = G.run, s = G.lastStats;
    return `<div class="screen center"><h2 class="bad">쓰러졌다</h2><p>${esc(PA.BOSS.name)}에게 패배했습니다. 준비 기간의 성과는 그대로입니다. 같은 장비·증강으로 바로 다시 도전할 수 있습니다.</p>
      <p class="dim small">전투 ${Math.round(s.elapsed)}초 · 보스에게 준 피해 ${Math.round(s.bossDamage)} / ${PA.BOSS.hp} · 감속장 ${s.specialUses}회 · 재도전 ${run.bossRetries}회</p>
      <div class="menu"><button class="primary big" data-action="boss-start">같은 준비로 재도전</button><button class="big" data-action="base">최종 준비 화면으로</button><button class="big" data-action="title">제목으로</button></div></div>`;
  }
  function bossVictory(G) {
    const run = G.run, s = G.lastStats, b = R().build(run), rec = G.lastRecord || run.lastBossClear || {};
    const augs = Object.keys(run.augments).filter(k => run.augments[k] > 0).map(k => { const d = PA.AUGMENTS.find(a => a.id === k); return d.name + (d.max > 1 ? ' ' + run.augments[k] : ''); }).join(', ') || '없음';
    return `<div class="screen center"><h1>예언의 날을 넘겼다.</h1><h2>${esc(PA.BOSS.name)} — ${esc(PA.BOSS.title)} 처치</h2>
      <div class="card"><div class="card-title">회차 결과</div>
        <ul class="gear" style="text-align:left">
          <li>전투 시간: <b>${Math.round(s.elapsed * 10) / 10}초</b> · 재도전 <b>${run.bossRetries}회</b></li>
          <li>무기: <b>${esc(b.weapon.name)}${run.gear.upgrade ? ' +' + run.gear.upgrade : ''}</b> · 장신구: <b>${run.gear.acc ? esc(R().item(run.gear.acc).name) : '없음'}</b> · 방어구: <b>${run.gear.armor ? esc(R().item(run.gear.armor).name) : '없음'}</b></li>
          <li>증강: ${esc(augs)}</li>
          <li>감속장 사용 <b>${s.specialUses}</b>회 · 보스에게 준 총피해 <b>${Math.round(s.bossDamage)}</b> (실제 체력 감소 기준)</li>
          <li class="dim small">첫 처치 기록${G.firstClearNew ? '으로 저장됨' : ': ' + (run.bossClear ? run.bossClear.time + '초' : '—')} · 효과별 피해 통계는 후속</li>
        </ul></div>
      <div class="menu"><button class="primary big" data-action="boss-start">이번 빌드로 보스 다시 도전</button><button class="big" data-action="newrun-confirm">새 회차 시작</button><button class="big" data-action="title">제목으로</button></div></div>`;
  }
  function enddayConfirm(G) {
    const run = G.run;
    return `<div class="screen center"><h2>하루를 마칠까요?</h2><p>남은 ${run.hours}시간을 버리고 ${run.day + 1}일차로 넘어갑니다. 체력이 완전히 회복되고 시간이 5로 돌아옵니다.</p>
      ${run.day + 1 >= PA.CONFIG.BOSS_DAY ? `<div class="card boss"><div class="card-title">내일 ${esc(PA.BOSS.name)}가 도래합니다</div><p>7일차에는 일반 출격이 없습니다. 최종 준비(구매·강화·판매·장비 교체) 뒤 보스전에 들어갑니다. 패배해도 같은 준비로 바로 재도전할 수 있습니다.</p></div>` : `<p class="dim">보스 도래까지 ${R().bossDaysLeft(run) - 1}일 남음</p>`}
      <div class="row"><button class="primary" data-action="endday">하루 종료</button><button data-action="base">돌아가기</button></div></div>`;
  }
  function bossday(G) {
    const run = G.run;
    return `<div class="screen center"><h2>보스 도래 — ${run.day}일차</h2>
      <p>예언의 날이 왔습니다. 준비 기간이 끝났습니다.</p>
      <div class="card"><div class="card-title">이 빌드의 한계</div><p><b>보스전은 아직 구현되어 있지 않습니다.</b> 이 화면은 결말을 완료된 것처럼 꾸미지 않기 위한 정직한 종료 화면입니다.</p>
      <p class="dim">회차 기록: 조우 ${run.stats.encounters} · 승리 ${run.stats.wins} · 패배 ${run.stats.losses} · 최종 금화 ${run.gold}</p></div>
      ${buildPanel(run)}
      <div class="row"><button class="primary big" data-action="newrun-confirm">새 회차 시작</button><button data-action="title">제목으로</button></div></div>`;
  }
  function scenarioEnd(G) {
    const s = G.lastStats;
    return `<div class="screen center"><h2>시험 전투 종료: ${G.lastResult === 'won' ? '승리' : '패배'}</h2>
      <p class="dim">처치 ${s.kills}${s.savingKills ? ` (감속장 안 ${s.savingKills})` : ''} · 받은 피해 ${Math.round(s.damageTaken)} · 공격 ${s.attacks}회 · ${Math.round(s.elapsed)}초${s.bossDamage ? ` · 보스 피해 ${Math.round(s.bossDamage)} · 감속장 ${s.specialUses}회` : ''}</p>
      <div class="row"><button class="primary" data-action="scenario-again">같은 시드로 다시</button><button data-action="title">제목으로</button></div></div>`;
  }
  function controls() {
    return `<div class="panel"><h2>조작법</h2>
      <table class="keys"><tr><td>W A S D / 방향키</td><td>이동</td></tr><tr><td>Space</td><td>회피 (0.26초 무적, 이동 방향으로 구르기)</td></tr><tr><td>Q</td><td>감속장 (주변 적을 3초간 느리게)</td></tr><tr><td>Esc</td><td>일시정지 / 메뉴</td></tr><tr><td>Enter · 클릭</td><td>메뉴 확인</td></tr></table>
      <h3>읽어야 할 것</h3><ul>
        <li><b>붉은 화살표</b>: 늑대가 돌진할 직선. 화살표가 굵어지며 "!"가 뜨면 방향이 고정된 것 — 옆으로 피하세요.</li>
        <li><b>붉은 점선</b>: 궁수의 조준선. 굵어지면 발사 직전.</li>
        <li><b>보라색 원</b>: 포자 구름이 생길 자리. 원 밖으로 나가세요. 구름은 5초간 남습니다.</li>
        <li><b>노란 별</b>: 빈틈. 이때 때리면 피해 1.5배.</li>
        <li>자동 공격은 사거리 안에 적이 있을 때만 가장 가까운 적을 향해 나갑니다.</li>
        <li><b>바위·나무</b>: 이동·회피·돌진을 막습니다. 검격·관통·회전 같은 <b>직접 공격</b>은 장애물 뒤를 때리지 못하지만, <b>불길·폭발·감속장·정지된 칼날</b>은 바닥 범위대로 적용됩니다.</li>
        <li><b>보스</b>: 붉은 통로(돌진), 부채꼴(휩쓸기), 원(덮쳐찍기), 발자국(늑대 등장). 큰 공격 뒤 "빈틈!"에 붙어서 때리세요. 감속장은 보스도 늦춥니다.</li></ul>
      <button data-action="close-overlay" class="primary">닫기</button></div>`;
  }
  function pause(G) {
    return `<div class="panel"><h2>일시정지</h2><p class="dim">전투가 멈춰 있습니다.</p>
      <div class="row"><label>음량 <input type="range" id="vol" min="0" max="100" value="${Math.round(PA.Audio.volume * 100)}"></label><label><input type="checkbox" id="mute" ${PA.Audio.muted ? 'checked' : ''}> 음소거</label></div>
      <div class="row"><button class="primary" data-action="resume">계속 (Esc)</button><button data-action="show-controls">조작법</button><button class="danger" data-action="give-up">포기하고 거점으로 (패배 처리)</button></div></div>`;
  }
  // 보스 초상(카드용 작은 캔버스): 렌더러의 보스 그리기를 재사용
  function paintPortraits() {
    for (const c of document.querySelectorAll('canvas.bossportrait')) {
      const ctx = c.getContext('2d'); ctx.fillStyle = '#1b2118'; ctx.fillRect(0, 0, c.width, c.height);
      const fake = { arena: PA.CONFIG.ARENA, obstacles: [], player: { x: 400, y: 45, r: 14 }, enemies: [], effects: [], zones: [], pickups: [], field: null, t: 0, boss: null, markTarget: null };
      const e = { boss: true, type: 'boss', def: PA.ENEMIES.boss, x: 70, y: 52, r: 42, hp: 1, hpMax: 1, state: 'intro', stateT: 0, animT: 0, moveT: 0, faceX: 1, flash: 0, chill: 0, stasis: 0, biteT: 9, dead: false, deathT: 0, aimAngle: 0, dir: 0, leapK: 0 };
      ctx.save(); ctx.scale(0.8, 0.8); PA.Render.drawBoss(ctx, fake, e); ctx.restore();
    }
  }
  return { title, newrunConfirm, base, finalPrep, map, shop, reward, after, defeat, bossDefeat, bossVictory, enddayConfirm, bossday, scenarioEnd, controls, pause, paintPortraits, bossCard };
})();

</script>
<script>
// 메인 루프·입력·화면 전환. 시뮬레이션은 고정 시간 단계로만 진행한다.
var PA = (typeof PA !== 'undefined') ? PA : {};

(function () {
  const G = {
    screen: 'title', run: null, saved: null, sortie: null, combat: null, offers: null, lastReward: null, lastStats: null, lastResult: null,
    paused: false, debug: false, overlay: null, scenario: null,
    input: PA.Input.create(), acc: 0, last: 0, endTimer: 0, eventCounts: {},
  };
  window.PA_G = G; // 검증용 훅(사람용 UI 아님)

  const $ = (s) => document.querySelector(s);
  let canvas, ctx, uiEl, overlayEl, stageEl;

  // ---------- 화면 ----------
  function show(name) {
    G.screen = name;
    const S = PA.Screens;
    const html = {
      title: () => S.title(G), newrun_confirm: () => S.newrunConfirm(G), base: () => S.base(G), map: () => S.map(G), shop: () => S.shop(G),
      reward: () => S.reward(G), after: () => S.after(G), defeat: () => S.defeat(G), endday_confirm: () => S.enddayConfirm(G), scenario_end: () => S.scenarioEnd(G),
      boss_defeat: () => S.bossDefeat(G), boss_victory: () => S.bossVictory(G),
    }[name];
    uiEl.innerHTML = html ? html() : '';
    if (html) { try { S.paintPortraits(); } catch (e) {} }
    uiEl.hidden = !html;
    stageEl.hidden = !!html;
    if (!html) fitCanvas();
    window.scrollTo(0, 0);
  }
  function openOverlay(kind) {
    G.overlay = kind;
    overlayEl.innerHTML = kind === 'pause' ? PA.Screens.pause(G) : PA.Screens.controls();
    overlayEl.hidden = false;
    const vol = $('#vol'), mute = $('#mute');
    if (vol) vol.addEventListener('input', () => PA.Audio.setVolume(vol.value / 100));
    if (mute) mute.addEventListener('change', () => PA.Audio.setMuted(mute.checked));
  }
  function closeOverlay() { G.overlay = null; overlayEl.hidden = true; overlayEl.innerHTML = ''; }
  function pauseCombat(on) { if (G.screen !== 'combat') return; G.paused = on; PA.Input.setBlocked(G.input, on); if (on) openOverlay('pause'); else closeOverlay(); }

  // ---------- 회차 흐름 ----------
  function saveRun() { if (G.run && !G.scenario) PA.Run.save(G.run); }
  function goBase() { saveRun(); show('base'); } // 7일차(boss_prep/cleared)는 base가 최종 준비 화면을 그린다
  function leaveScenario() { if (G.scenario) { G.scenario = null; try { history.replaceState(null, '', location.pathname); } catch (e) {} } }
  function newRun() { leaveScenario(); G.run = PA.Run.newRun(); G.sortie = null; G.combat = null; saveRun(); show('base'); }
  function startSortie(regionId) {
    G.sortie = PA.Run.startSortie(G.run, regionId);
    saveRun(); // 출격 비용은 지불된 상태로 저장(전투 중 종료 시 복구 기준)
    startEncounter();
  }
  function startEncounter() {
    const run = G.run, s = G.sortie;
    if (s.regionId === 'boss') {
      G.combat = PA.Combat.create({ build: PA.Run.build(run), hp: PA.Run.build(run).hpMax, seed: s.seed, boss: true, arena: 'clearing', waves: [] });
    } else G.combat = PA.Combat.create({
      build: PA.Run.build(run), hp: run.hp, seed: s.seed + s.encounters * 1000 + (s.deep ? 7 : 0),
      waves: PA.Run.encounterWaves(s.regionId, s.deep), objective: PA.Run.encounterObjective(s.regionId, s.deep), arena: s.arena || 'forest',
    });
    G.endTimer = 0; G.acc = 0; G.paused = false; G.eventCounts = {}; PA.Input.setBlocked(G.input, false); closeOverlay();
    show('combat');
  }
  function startBoss() {
    G.sortie = PA.Run.startBoss(G.run);
    saveRun(); // 보스 직전 상태 저장: 전투 중 종료 시 최종 준비에서 다시 시작
    startEncounter();
  }
  function onEncounterEnd() {
    const c = G.combat, run = G.run, s = G.sortie;
    G.lastStats = Object.assign({}, c.stats);
    G.lastResult = c.status;
    if (G.scenario) { show('scenario_end'); return; }
    if (c.mode === 'boss') {
      if (c.status === 'won') {
        const hadFirst = !!run.bossClear;
        const rec = PA.Run.bossVictory(run, c.stats); G.lastRecord = rec;
        const R = PA.Run.saveRecord(rec); G.firstClearNew = !hadFirst && R.firstClear && R.firstClear.at === rec.at;
        saveRun(); G.sortie = null; show('boss_victory');
      } else { PA.Run.bossDefeat(run); saveRun(); G.sortie = null; show('boss_defeat'); }
      return;
    }
    const eliteKilled = c.enemies.some(e => e.elite && e.dead) || c.status === 'won' && c.objective === 'elite';
    if (c.status === 'won') {
      const reward = PA.Run.rollReward(run, s, c.rng, { chestGold: c.stats.chestGold, eliteKilled });
      PA.Run.applyEncounterResult(run, s, 'won', reward, c.player.hp);
      G.lastReward = reward;
      G.offers = PA.Run.augmentOffers(run, c.rng, 3);
      show('reward');
    } else {
      PA.Run.applyEncounterResult(run, s, 'lost', null, 0);
      PA.Run.defeat(run, s);
      saveRun();
      show('defeat');
    }
  }

  // ---------- 동작 처리 ----------
  const actions = {
    'continue': () => { leaveScenario(); G.run = G.saved; G.sortie = null; G.combat = null; goBase(); },
    'newrun': () => { if (G.saved) show('newrun_confirm'); else newRun(); },
    'newrun-confirm': () => newRun(),
    'title': () => { leaveScenario(); G.saved = PA.Run.load(); show('title'); },
    'controls': () => openOverlay('controls'),
    'show-controls': () => openOverlay('controls'),
    'close-overlay': () => { if (G.paused) openOverlay('pause'); else closeOverlay(); },
    'base': () => goBase(),
    'map': () => show('map'),
    'shop': () => show('shop'),
    'rest': () => { PA.Run.rest(G.run); saveRun(); show('base'); },
    'endday-confirm': () => show('endday_confirm'),
    'endday': () => { PA.Run.endDay(G.run); saveRun(); goBase(); },
    'boss-start': () => startBoss(),
    'equip': (id) => { PA.Run.equip(G.run, id); saveRun(); show(G.screen); },
    'unequip': (slot) => { PA.Run.unequip(G.run, slot); saveRun(); show(G.screen); },
    'save-quit': () => { saveRun(); G.saved = PA.Run.load(); show('title'); },
    'sortie': (id) => startSortie(id),
    'buy': (id) => { PA.Run.buy(G.run, id); PA.Audio.play('buy'); saveRun(); show('shop'); },
    'target': (id) => { PA.Run.setTarget(G.run, id); saveRun(); show('shop'); },
    'sell': (id) => { PA.Run.sell(G.run, id, 1); saveRun(); show('shop'); },
    'toggle-weapon': () => { if (G.run.gear.weapon === 'pierce') PA.Run.unequipWeapon(G.run); else PA.Run.equip(G.run, 'pierce_sword'); saveRun(); show(G.screen); },
    'pick': (id) => { PA.Run.takeAugment(G.run, id); G.offers = null; saveRun(); show('after'); },
    'skip': () => { PA.Run.skipAugment(G.run); G.offers = null; saveRun(); show('after'); },
    'deep': () => { PA.Run.deepExplore(G.run, G.sortie); saveRun(); startEncounter(); },
    'return': () => { PA.Run.returnToBase(G.run, G.sortie); G.sortie = null; goBase(); },
    'resume': () => pauseCombat(false),
    'give-up': () => { closeOverlay(); G.paused = false; PA.Input.setBlocked(G.input, false); if (G.combat) { G.combat.player.hp = 0; G.combat.player.dead = true; G.combat.status = 'lost'; G.endTimer = 10; } },
    'scenario-again': () => startScenario(G.scenario),
  };
  function dispatch(action, arg) {
    PA.Audio.init(); PA.Audio.play('ui');
    const f = actions[action]; if (!f) return;
    try { f(arg); } catch (e) { console.error(e); alert(e.message); }
  }

  // ---------- 시나리오(시험 전투) ----------
  function parseScenario() {
    const q = new URLSearchParams(location.search);
    if (!q.get('scenario')) return null;
    return { region: q.get('scenario'), arena: q.get('arena') || null, acc: q.get('acc') || null, armor: q.get('armor') || null, seed: parseInt(q.get('seed') || '1', 10), aug: (q.get('aug') || '').split(',').filter(Boolean), weapon: q.get('weapon') || 'sword', deep: q.get('deep') === '1', upgrade: parseInt(q.get('upgrade') || '0', 10) };
  }
  function startScenario(sc) {
    G.scenario = sc;
    const run = PA.Run.newRun(sc.seed);
    run.gear.weapon = sc.weapon === 'pierce' ? 'pierce' : 'sword';
    run.gear.upgrade = sc.upgrade || 0;
    if (sc.acc) { run.owned.push(sc.acc); run.gear.acc = sc.acc; }
    if (sc.armor) { run.owned.push(sc.armor); run.gear.armor = sc.armor; }
    for (const a of sc.aug) { const [id, lv] = a.split(':'); run.augments[id] = parseInt(lv || '1', 10); }
    if (run.augments.barrier) {} // 파생은 Build.derive에서
    run.hp = PA.Run.build(run).hpMax;
    G.run = run;
    G.sortie = { regionId: sc.region, deep: sc.deep, loot: { gold: 0, mats: {} }, encounters: 0, seed: sc.seed, arena: sc.arena };
    startEncounter();
  }

  // ---------- 캔버스 ----------
  function fitCanvas() {
    const W = PA.CONFIG.ARENA.w + PA.CONFIG.VIEW.pad * 2, H = PA.CONFIG.ARENA.h + PA.CONFIG.VIEW.pad * 2;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = Math.floor(W * scale) + 'px'; canvas.style.height = Math.floor(H * scale) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function render() {
    if (G.screen !== 'combat' || !G.combat) return;
    PA.Render.draw(ctx, G.combat, { debug: G.debug });
    if (G.paused) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, PA.CONFIG.ARENA.w + PA.CONFIG.VIEW.pad * 2, PA.CONFIG.ARENA.h + PA.CONFIG.VIEW.pad * 2); }
  }

  // ---------- 루프 ----------
  function inputState() { return PA.Input.state(G.input); }
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (ts - (G.last || ts)) / 1000); G.last = ts;
    if (G.screen === 'combat' && G.combat && !G.paused) {
      G.acc += dt;
      const STEP = PA.CONFIG.STEP;
      let inp = inputState(); let first = true; let guard = 0;
      while (G.acc >= STEP && guard++ < 12) {
        PA.Combat.step(G.combat, inp, STEP);
        if (first) { PA.Input.consumePressed(G.input); inp = inputState(); first = false; }
        G.acc -= STEP;
      }
      if (guard >= 12) G.acc = 0;
      for (const e of G.combat.events) G.eventCounts[e.name] = (G.eventCounts[e.name] || 0) + 1;
      for (const e of G.combat.events) PA.Audio.play(e.name === 'hit' ? (e.crit ? 'crit' : 'hit') : ({ kill: 'kill', hurt: 'hurt', lock: 'lock', dodge: 'dodge', perfect: 'perfect', special: 'special', chest: 'chest', win: 'win', lose: 'lose', wave: 'wave', shoot: 'shoot', spore: 'spore', explode: 'explode', shatter: 'shatter', burst: 'burst', bite: 'bite', swing: 'swing', boss_howl: 'boss_howl', boss_roar: 'boss_roar', boss_land: 'boss_land', boss_sweep: 'boss_sweep', boss_lock: 'boss_lock', boss_down: 'win', orb: 'orb' }[e.name] || null));
      G.combat.events.length = 0;
      if (G.combat.status !== 'running') { G.endTimer += dt; if (G.endTimer >= (G.combat.mode === 'boss' && G.combat.status === 'won' ? 2.4 : 1.3)) onEncounterEnd(); }
    }
    render();
  }

  // ---------- 입력 ----------
  function onKeyDown(e) {
    if (e.repeat) return;
    if (e.code === 'F3') { G.debug = !G.debug; e.preventDefault(); return; }
    if (G.screen === 'combat') {
      if (e.code === 'Escape') { if (G.overlay === 'controls') openOverlay('pause'); else pauseCombat(!G.paused); e.preventDefault(); return; }
      if (['Space', 'KeyQ', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (G.paused || G.overlay) return;          // 정지·메뉴 중 전투 입력은 버린다
      PA.Input.keyDown(G.input, e.code);
      PA.Audio.init();
    } else if (e.code === 'Enter') {
      const btn = uiEl.querySelector('button.primary:not([disabled])'); if (btn) btn.click();
    } else if (e.code === 'Escape' && G.overlay) closeOverlay();
  }
  function onKeyUp(e) { PA.Input.keyUp(G.input, e.code); }

  function init() {
    canvas = $('#game'); ctx = canvas.getContext('2d'); uiEl = $('#ui'); overlayEl = $('#overlay'); stageEl = $('#stage');
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { PA.Input.clearAll(G.input); if (G.screen === 'combat' && !G.paused && G.combat && G.combat.status === 'running') pauseCombat(true); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { PA.Input.clearAll(G.input); if (G.screen === 'combat' && !G.paused && G.combat && G.combat.status === 'running') pauseCombat(true); } });
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-action]'); if (b && !b.disabled) dispatch(b.dataset.action, b.dataset.arg); });
    fitCanvas();
    G.saved = PA.Run.load();
    const sc = parseScenario();
    if (sc) startScenario(sc); else show('title');
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
